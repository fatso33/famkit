<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Family Kitchen - Family Recipe Vault</title>
    <meta
      name="description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."

    <meta property="og:title" content="Family Kitchen - Family Recipe Vault" />

      property="og:description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."

    <meta name="theme-color" content="#c85a32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"

    />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.debug('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
