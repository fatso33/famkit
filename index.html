<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f5" />
    <!-- The page's fonts arrive with the app, not only once its first text is laid out: after
         a launch screen with no text, the Recipe Box was laid out in a fallback font and then
         again as the fonts swapped in, mid-entrance. Latin-ext carries the Polish letters. -->
    <link
      rel="preload"
      href="/src/assets/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/fraunces-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/source-sans-3-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/source-sans-3-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Apply the stored theme, season, text size and language before the first paint, so dark
      // mode, the season's colours and large text don't flash in at the start of the splash.
      // Same keys and rules as services/storage.ts and utils/season.ts (seasonPalette.test.ts
      // checks the colours); React takes over from here.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('wandas_theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          root.setAttribute('data-theme', theme);
          var seasons = ['winter', 'spring', 'summer', 'autumn'];
          var season = localStorage.getItem('wandas_season');
          if (seasons.indexOf(season) < 0)
            season = seasons[Math.floor(((new Date().getMonth() + 1) % 12) / 3)];
          root.setAttribute('data-season', season);
          var pageBackground = {
            spring: { light: '#faf9f6', dark: '#121412' },
            summer: { light: '#f7fafa', dark: '#101416' },
            autumn: { light: '#fbf9f5', dark: '#161311' },
            winter: { light: '#f8f9fb', dark: '#121417' },
          };
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', pageBackground[season][theme]);
          var scale = parseFloat(localStorage.getItem('wandas_font_scale') || '1');
          if (!isNaN(scale)) {
            root.style.setProperty('--font-scale', String(Math.min(1.4, Math.max(0.85, scale))));
          }
          if (localStorage.getItem('wandas_language') === 'pl') root.lang = 'pl';
        } catch (e) {
          // Storage blocked (private mode): the app's defaults apply.
        }
      })();
    </script>
    <title>Family Kitchen - Family Recipe Box</title>
    <meta
      name="description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."
    />
    <meta property="og:title" content="Family Kitchen - Family Recipe Box" />
    <meta
      property="og:description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."
    />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family Kitchen" />
    <meta property="og:image" content="./logo.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.debug('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
