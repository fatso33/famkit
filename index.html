<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the stored theme, text size and language before the first paint, so dark mode
      // and large text don't flash in at the start of the splash. Same keys and rules as
      // services/storage.ts; React takes over from here.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('wandas_theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          root.setAttribute('data-theme', theme);
          var scale = parseFloat(localStorage.getItem('wandas_font_scale') || '1');
          if (!isNaN(scale)) {
            root.style.setProperty('--font-scale', String(Math.min(1.4, Math.max(0.85, scale))));
          }
          if (localStorage.getItem('wandas_language') === 'pl') root.lang = 'pl';
        } catch (e) {
          // Storage blocked (private mode): the app's defaults apply.
        }
      })();
    </script>
    <title>Family Kitchen - Family Recipe Vault</title>
    <meta
      name="description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."
    />
    <meta property="og:title" content="Family Kitchen - Family Recipe Vault" />
    <meta
      property="og:description"
      content="Heirloom family recipes featuring Wanda's Cheese Bread with verbatim instructions, dynamic portion scaling, cook mode wake lock, and offline PWA capability."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ad4f2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family Kitchen" />
    <meta property="og:image" content="./logo.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.debug('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
